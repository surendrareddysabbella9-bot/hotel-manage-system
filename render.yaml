services:
  - type: web
    name: restaurantos-backend
    env: node
    buildCommand: "cd server && npm install"
    startCommand: "cd server && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurantos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production

  - type: web
    name: restaurantos-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: restaurantos-backend
          property: host

databases:
  - name: restaurantos-db
    databaseName: restaurantos
    user: restaurantos_user
